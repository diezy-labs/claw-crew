name: Release Gate — Prerelease to Main

# Trigger: PR to main branch from prerelease
# Action: Require explicit Achmad approval before merge
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  release-gate-approval:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Verify PR is from prerelease
        id: verify
        run: |
          HEAD_BRANCH="${{ github.event.pull_request.head.ref }}"
          BASE_BRANCH="${{ github.event.pull_request.base.ref }}"
          
          if [ "$HEAD_BRANCH" != "prerelease" ] || [ "$BASE_BRANCH" != "main" ]; then
            echo "is_release_pr=false" >> $GITHUB_OUTPUT
          else
            echo "is_release_pr=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Post release gate check (blocking until approval)
        if: steps.verify.outputs.is_release_pr == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🎯 **RELEASE GATE — Achmad Approval Required**

This PR is attempting to merge **prerelease → main** (production release).

⚠️ **This requires explicit approval from Achmad (user) before merging.**

### Status: ⏳ AWAITING RELEASE APPROVAL

**To approve and release:**
1. Review PR + commit log
2. Verify all Phase 3 features working (testing + prerelease gates passed)
3. Comment: \`✅ Approved for release: Phase 3 [version]\`

**To reject / hold release:**
1. Comment: \`❌ Hold release: [reason]\`
2. PR will remain open, no auto-merge

### Checklist
- [ ] All testing gates passed
- [ ] QA crew approved this branch
- [ ] Principle crew reviewed + approved
- [ ] No breaking changes
- [ ] Ready for production

---

*This is a manual approval gate. GitHub Actions will NOT auto-merge this PR.*`
            })
      
      - name: Set PR status (pending approval)
        if: steps.verify.outputs.is_release_pr == 'true'
        run: |
          # Use gh CLI to add required status check (blocking merge)
          # Note: This requires branch protection rule to be configured
          echo "✅ Release gate PR received"
          echo "📋 Awaiting Achmad approval comment"
          echo "🔒 Merge is blocked until approval"
      
      - name: Discord notification — Release gate triggered
        if: steps.verify.outputs.is_release_pr == 'true'
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "content": "🎯 **RELEASE GATE — Manual Approval Needed**",
              "embeds": [{
                "title": "PR #${{ github.event.pull_request.number }} — prerelease → main",
                "url": "${{ github.event.pull_request.html_url }}",
                "color": 15105570,
                "fields": [
                  {"name": "Status", "value": "⏳ Awaiting Achmad approval", "inline": true},
                  {"name": "Type", "value": "Production Release", "inline": true},
                  {"name": "Action Required", "value": "Comment: ✅ Approved for release: [version]", "inline": false},
                  {"name": "Note", "value": "This merge is BLOCKED until you approve. No auto-merge on this gate.", "inline": false}
                ],
                "footer": {"text": "galleon-fleet Phase 3 — Manual release approval gate"}
              }]
            }' \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        continue-on-error: true
---

# Separate job: Monitor for Achmad approval comment and enable merge
name: Release Approval Detector
on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  detect-release-approval:
    # Only run on PR comments (not issues)
    if: github.event.issue.pull_request != null
    
    runs-on: ubuntu-latest
    
    steps:
      - name: Check for approval comment
        id: check-approval
        run: |
          COMMENT="${{ github.event.comment.body }}"
          PR_BASE="${{ github.event.issue.pull_request.base.ref }}"
          
          # Detect approval: ✅ Approved for release OR similar pattern
          if [[ "$COMMENT" =~ ✅[[:space:]]*Approved[[:space:]]*for[[:space:]]*release ]]; then
            echo "is_approved=true" >> $GITHUB_OUTPUT
            echo "message=$(echo "$COMMENT" | head -c 500)" >> $GITHUB_OUTPUT
          else
            echo "is_approved=false" >> $GITHUB_OUTPUT
          fi
          
          # Check if this is a prerelease → main PR
          if [ "$PR_BASE" = "main" ]; then
            echo "is_main_pr=true" >> $GITHUB_OUTPUT
          else
            echo "is_main_pr=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Post approval confirmation
        if: steps.check-approval.outputs.is_approved == 'true' && steps.check-approval.outputs.is_main_pr == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ **Release Approved by Achmad**

Release approval confirmed. This PR is now ready to merge.

**Action:** Merge this PR to main to deploy Phase 3 to production.

---

*You can now merge via GitHub, or we can auto-merge on your signal.*`
            })
      
      - name: Discord notification — Release approved
        if: steps.check-approval.outputs.is_approved == 'true' && steps.check-approval.outputs.is_main_pr == 'true'
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "content": "✅ **Release Approved — Ready to Deploy**",
              "embeds": [{
                "title": "PR #${{ github.event.issue.number }} — APPROVED FOR PRODUCTION",
                "color": 3066993,
                "fields": [
                  {"name": "Status", "value": "✅ Approved by Achmad", "inline": true},
                  {"name": "Action", "value": "Manual merge to main (or auto-merge if configured)", "inline": true},
                  {"name": "Next", "value": "Merge PR → Phase 3 deployed to production", "inline": false}
                ],
                "footer": {"text": "galleon-fleet Phase 3 Release — Production deployment"}
              }]
            }' \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        continue-on-error: true
