[package]
name = "clawcrew-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HTTP/WebSocket gateway for ClawCrew — REST API, web dashboard, webhooks."
repository.workspace = true
homepage.workspace = true
publish = true

[dependencies]
# Internal workspace crates
clawcrew-api.workspace = true
clawcrew-spawn.workspace = true
clawcrew-config.workspace = true
clawcrew-tls.workspace = true
clawcrew-infra.workspace = true
clawcrew-log.workspace = true
clawcrew-memory.workspace = true
clawcrew-providers.workspace = true
clawcrew-channels = { workspace = true, default-features = false, features = ["channel-acp-server"] }
clawcrew-runtime.workspace = true
clawcrew-tools.workspace = true
clawcrew-hardware.workspace = true
clawcrew-plugins = { workspace = true, optional = true }

# gRPC server for SystemGateway (D1): Go engine -> Rust native-tool execution.
# `prost` must stay a direct dep: tonic-build's generated code references
# `::prost::...` paths directly, so this crate needs `prost` in scope by name.
# Pinned to the version tonic 0.12 / tonic-build 0.12 themselves resolve to —
# a mismatched "0.12" here previously diamond-deped against a separate prost
# 0.12.6, breaking the `Message` trait identity for the generated types.
tonic = "0.12"
prost = "0.13"

# HTTP server
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "ws", "macros"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "server-graceful"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", default-features = false, features = ["limit", "timeout", "fs"] }
http-body-util = "0.1"

# TLS
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["logging", "tls12", "ring"] }

# Frontend asset MIME type detection (dashboard served from filesystem)
mime_guess = "2"

# Base64 encoding for binary file content in agent workspace `read` responses.
base64 = "0.22"
include_dir = { version = "0.7", optional = true }

# Schemars JSON Schema generation for OPTIONS responses; matches the version
# clawcrew-config already pulls.
schemars = { version = "1.2", optional = true }

# Async runtime
tokio = { version = "1.50", default-features = false, features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync", "signal", "process"] }
tokio-stream = { version = "0.1.18", default-features = false, features = ["sync"] }
tokio-util = { version = "0.7", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

# Serialization
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
socket2 = "0.6"

# Error handling
anyhow = "1.0"
async-trait = "0.1"
directories = "6.0"

# Crypto
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# Database (session queue)
rusqlite = { version = "0.37", features = ["bundled"] }

# Misc
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
parking_lot = "0.12"
toml = "1.0"
toml_edit = "0.25"
uuid = { version = "1.22", default-features = false, features = ["v4", "std"] }

# Unix-only: self-signal SIGTERM to trigger the daemon's graceful shutdown for
# supervised post-upgrade restart (version.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
rand = "0.10"
rcgen = "0.13"
tempfile = "3.26"
# Enables the runtime's deterministic clock seam for production-shaped cache
# fixtures; this feature is dev-only and is not part of the shipped gateway.
clawcrew-runtime = { workspace = true, features = ["test-util"] }
tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "test-util"] }
# Real WebSocket client used to drive the `/acp` route end-to-end in
# acp::tests (front-door proof for the gateway ACP surface). A plain
# non-TLS loopback connection needs only the `connect` feature, no TLS.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
wiremock = "0.6"
# Builds the raw gRPC path for the D1 SystemGateway wire-protocol test
# (system_gateway_integration_test.rs) — this crate's own `tonic`/`axum`
# already pull `http` transitively; pinning the same major here just makes
# it nameable from `tests/`.
http = "1"

[features]
default = ["schema-export", "a2a"]
# A2A (Agent2Agent) discovery surface: well-known catalog card + per-alias
# agent cards. Default-on; the runtime surface stays default-closed via
# [a2a.server] enabled = false. Pure-serde cards on the existing axum stack,
# no a2a-rs/protobuf footprint.
a2a = []
plugins-wasm = ["dep:clawcrew-plugins"]
webauthn = ["clawcrew-runtime/webauthn"]
observability-prometheus = ["clawcrew-runtime/observability-prometheus"]
channel-acp-server = ["clawcrew-channels/channel-acp-server"]
channel-email = ["clawcrew-channels/channel-email"]
channel-linq = ["clawcrew-channels/channel-linq"]
channel-nextcloud = ["clawcrew-channels/channel-nextcloud"]
channel-nostr = ["clawcrew-channels/channel-nostr"]
channel-wechat = ["clawcrew-channels/channel-wechat"]
channel-whatsapp-cloud = ["clawcrew-channels/channel-whatsapp-cloud"]
whatsapp-web = ["clawcrew-channels/whatsapp-web"]
gateway-voice-duplex = []
# Enables OPTIONS /api/config* responses with the schemars-generated
# JSON Schema body and the serde-side schemars derives transitively. Defaults
# on; turning it off omits OPTIONS schema bodies (returns a small placeholder)
# and saves a bit of build time. Mirrors clawcrew-config's `schema-export`.
schema-export = ["clawcrew-config/schema-export", "clawcrew-runtime/schema-export", "dep:schemars"]
embedded-web = ["dep:include_dir"]
