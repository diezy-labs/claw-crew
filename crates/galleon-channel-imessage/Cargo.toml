[package]
name = "galleon-channel-imessage"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "iMessage channel feature-crate (RF-C1 split; AppleScript bridge + Messages.app SQLite polling, ported from clawcrew-channels)."
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
galleon-channel-core.workspace = true
clawcrew-api.workspace = true
clawcrew-log.workspace = true
async-trait = "0.1"
directories = "6.0"
rusqlite = { version = "0.37", features = ["bundled"], optional = true }
tokio = { version = "1.50", default-features = false, features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync", "process", "io-std", "fs", "signal"] }
anyhow = "1.0"
serde_json = { version = "1.0", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3.26"

[features]
default = []
channel-imessage = ["rusqlite"]
