[package]
name = "galleon-channel-signal"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Signal channel feature-crate (RF-B1 split; signal-cli JSON-RPC/SSE body ported from clawcrew-channels)."
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
# RF-B1: the ported Signal body is a signal-cli JSON-RPC/SSE HTTP client, so it
# carries the HTTP + async-stream + collection deps upstream `clawcrew-channels`
# uses for this channel. Seams #1 (allowlist policy) and #2 (approval
# parse/token/prompt shape) now come from `galleon-channel-core`, which shares
# the real `clawcrew_config` peer-policy SSOT WITHOUT dragging clawcrew-runtime.
# The remaining ceiling is approval-prompt i18n (needs the runtime Fluent
# catalogue) and structured logging/env-proxy — documented in lib.rs.
galleon-channel-core.workspace = true
clawcrew-api.workspace = true
anyhow = "1.0"
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false }
lru = "0.18.2"
parking_lot = "0.12"
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = [
  "__rustls-ring",
  "json",
  "rustls-tls-webpki-roots-no-provider",
  "stream",
] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
uuid = { version = "1.22", default-features = false, features = ["std", "v4"] }
# `sync` for mpsc/oneshot/Mutex; `time` for the SSE reconnect backoff sleeps.
tokio = { version = "1.50", default-features = false, features = ["sync", "time"] }
